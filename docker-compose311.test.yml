version: '3.7'
services: 
   test_app:
      container_name: test_front_3_11
      build:  
         context: .
         dockerfile: dockerfile311.test
      command: python wsgi_test.py
      # command: gunicorn -w 1 -b 0.0.0.0:7007 wsgi:app  
      volumes: 
         - .:/usr/src/app/
      ports: 
         # - "127.0.0.1:7008:7007"
         # - "7101:7102"
         - "7104:7103"
      environment: 
         - TZ=Europe/Moscow
         - HTTP_PROXY=msc01-cfw01.pgk.rzd:9090
         - HTTPS_PROXY=msc01-cfw01.pgk.rzd:9090 
      network_mode: bridge   

networks: 
    net_nginx_prod: 
        driver: bridge
        ipam:
            config:
            - subnet: 172.17.48.0/24
            