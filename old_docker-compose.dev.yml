version: '3.5'
services: 
   dev_app:
      container_name: dev_front_ex
      build:  
         context: .
         dockerfile: dockerfile.dev
      command: python wsgi_dev.py
      # command: gunicorn -w 1 -b 0.0.0.0:7007 wsgi:app  
      volumes: 
         - .:/usr/src/app/
      ports: 
         # - "127.0.0.1:7008:7007"
         - "7101:7102"
      # depends_on: 
      #    - redis   
      environment: 
         - TZ=Europe/Moscow
      networks: 
         - dev_net_nginx      
   
   # dev_nginx:
   #    build:
   #       context: ./nginx
   #       dockerfile: dockerfile
   #    ports:
   #          - 7101:7101
   #    depends_on:
   #          - dev_app    
   #    networks: 
   #       - dev_net_nginx
networks: 
   dev_net_nginx: 
      driver: bridge
      ipam:
         config:
           - subnet: 13.7.1.0/16
            