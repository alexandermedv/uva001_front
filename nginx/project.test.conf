upstream app {
    # server test_app:7101;
    server 172.17.0.133:7101;
}

server {

    listen 7100;
    server_name front_test;

    location / {
        # proxy_pass http://ch-32.cgorod.pw:7008;
        proxy_pass http://app;
        # proxy_pass http://172.17.0.133:7100/

        # Do not change this
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;


        # proxy_set_header X-NginX-Proxy true;
        # proxy_pass http://localhost:7008/;
        # proxy_redirect http://localhost:7008/ https://$server_name/;
        proxy_redirect http://172.17.0.133/ http://172.17.0.133:7100/;

    }

    # location /static {
